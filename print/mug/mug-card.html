<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Glashaus Mug Card</title>
<!-- 4x6 portrait "Get the mug" card in the website's style (Nov 18). build.mjs inlines the QR codes,
     artwork and fonts and writes mug-card.pdf and mug-card.jpg (1200x1800, 300 dpi). -->
<style>
@page{size:4in 6in;margin:0}
:root{--grass:#E4C27A;--ink:#102A3A;--lake:#1D5C80;--paper:#FFFCF5;--line:rgba(16,42,58,.2)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Archivo",Arial,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.card{width:4in;height:6in;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
.art{height:2.2in;background:url(dome-art.jpg) 62% 40%/cover;position:relative}
.wm{position:absolute;left:.16in;top:.13in;display:flex;align-items:baseline;font-family:"Instrument Serif",Georgia,serif;font-size:17pt;letter-spacing:.06em;color:#fff;text-shadow:0 1px 6px rgba(16,42,58,.55)}
.wm svg{height:.69em;width:.78em;margin:0 .05em 0 .01em;overflow:visible;filter:drop-shadow(0 1px 3px rgba(16,42,58,.5))}
.band{background:var(--grass);padding:.13in .22in .12in;display:flex;justify-content:space-between;align-items:baseline}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:38pt;line-height:.9;margin:0}
.price{font-family:"Instrument Serif",Georgia,serif;font-size:38pt;line-height:.9;color:var(--lake)}
.sub{font-size:9.5pt;line-height:1.35;margin:.11in .22in .1in}
.pay{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:.12in;padding:0 .22in}
.qr{border:1px solid var(--line);background:#fff;padding:.08in .08in .06in;text-align:center}
.qr svg{display:block;width:100%;height:auto;aspect-ratio:1}
.qr .n{font-weight:700;font-stretch:112%;font-size:10.5pt;margin-top:.05in}
.qr .h{font-size:7.5pt;color:#3c5260}
.zelle{grid-column:1/-1;border:1px solid var(--line);background:#fff;padding:.08in .12in;display:flex;justify-content:space-between;align-items:center;font-size:9pt}
.zelle b{font-weight:700;font-stretch:112%;font-size:10.5pt}
.foot{background:var(--ink);color:#E9EEEC;font-size:8pt;text-align:center;padding:.09in .2in;margin-top:.12in}
</style>
<div class="card">
  <div class="art"><div class="wm" aria-label="Glashaus"><span>GL</span><svg viewBox="0 0 100 90"><polygon points="50,3 98,88 2,88" fill="#FFFCF5" fill-opacity=".35"/><path d="M50 3 L98 88 L2 88 Z M26 45.5 L74 45.5 L50 88 Z" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg><span>SHAUS</span></div></div>
  <div class="band"><h1>Get the mug</h1><span class="price">$20</span></div>
  <p class="sub">Take a little Glashaus home: this dome artwork on a mug. Pay any way below and please add <b>"mug"</b> in the note.</p>
  <div class="pay">
    <div class="qr">{{venmo}}<div class="n">Venmo</div><div class="h">@glashausresort</div></div>
    <div class="qr">{{paypal}}<div class="n">PayPal</div><div class="h">Scan to pay</div></div>
    <div class="zelle"><span><b>Zelle</b> &nbsp;(209) 559-4966</span><span>Sara Cooper</span></div>
  </div>
  <div class="foot">Thank you for staying with us! &nbsp;·&nbsp; Sara &amp; James</div>
</div>
</html>
